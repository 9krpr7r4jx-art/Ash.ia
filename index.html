<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ash.ia</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230c0c10'/><path d='M25 75 L50 25 L75 75 M35 55 L65 55' stroke='url(%23grad)' stroke-width='8' fill='none' stroke-linecap='round' stroke-linejoin='round'/><defs><linearGradient id='grad' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='%23a78bfa'/><stop offset='100%' stop-color='%23542b9e'/></linearGradient></defs></svg>">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0c0c10;color:#eee;font-family:'Segoe UI',Arial,sans-serif;height:100vh;display:flex;overflow:hidden}
button,select,textarea{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

/* --- LOGO --- */
.ash-logo-svg { width: 40px; height: 40px; display: inline-block; vertical-align: middle; margin-right: 10px; }
.ash-logo-big { width: 100px; height: 100px; margin: 0 auto 20px; display: block; filter: drop-shadow(0 0 20px rgba(126,34,206,0.5)); animation: float 3s ease-in-out infinite; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

/* Sidebar */
.sidebar{width:260px;background:#111116;border-right:1px solid #22222a;padding:20px;display:flex;flex-direction:column;flex-shrink:0}
.logo{font-size:22px;margin-bottom:30px;display:flex;align-items:center;font-weight:900;letter-spacing:-1px}
.logo span{background: linear-gradient(135deg, #d8b4fe, #7e22ce); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.new{background:#1c1c24;color:#ddd;border:1px solid #333;border-radius:8px;padding:12px;text-align:left;transition:0.2s}
.new:hover{border-color:#7e22ce;background:#22222a}
.section{font-size:11px;color:#666;margin:25px 0 12px;font-weight:bold;letter-spacing:1px}
.history{display:flex;flex-direction:column;gap:4px;overflow-y:auto;flex:1}
.history-item{display:flex;align-items:center;gap:4px}
.history-item > button:first-child{flex:1;min-width:0;background:none;color:#999;border:0;text-align:left;padding:10px;border-radius:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history button:hover,.history button.active{background:#1c1c24;color:#fff}
.history .del{flex:0 0 24px;color:#555;font-size:12px;padding:6px;text-align:center}
.history .del:hover{color:#f88}
.sidebar-actions{display:flex;gap:6px;margin-top:10px}
.sidebar-actions button{flex:1;background:#1a1a22;color:#888;border:1px solid #2a2a33;border-radius:6px;padding:6px;font-size:11px}
.sidebar-actions button:hover{color:#fff;border-color:#7e22ce}
.sidebar-bottom{margin-top:15px;color:#555;font-size:11px;line-height:1.6;border-top:1px solid #22222a;padding-top:15px}

/* Main Area */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
header{height:60px;border-bottom:1px solid #22222a;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#0c0c10;z-index:10}
.header-left{display:flex;align-items:center;gap:10px;font-weight:bold;font-size:18px}
.header-right{display:flex;align-items:center;gap:15px}

/* Discord Button */
.discord-btn{background:#5865F2;color:white;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:bold;display:flex;align-items:center;gap:8px;transition:0.2s;box-shadow:0 4px 12px rgba(88,101,242,0.3)}
.discord-btn:hover{background:#4752c4;transform:translateY(-1px);box-shadow:0 6px 16px rgba(88,101,242,0.4)}
.discord-btn svg{width:18px;height:18px;fill:currentColor}

.model{background:#141419;color:#ddd;border:1px solid #333;padding:8px 12px;border-radius:8px;font-size:13px;outline:none}
.status{font-size:10px;color:#555;margin-left:5px}
.status.ok{color:#4ade80}
.status.ko{color:#f87171}

/* Chat Area */
.chat{flex:1;overflow-y:auto;padding:20px;scroll-behavior:smooth}
.welcome{text-align:center;margin:10vh auto 30px;max-width:600px;animation:fadeIn 0.5s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.welcome h1{font-size:32px;margin-bottom:10px}
.welcome p{color:#888;margin-bottom:30px}
.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.suggestions button{padding:14px;background:#141419;color:#aaa;border:1px solid #22222a;border-radius:10px;text-align:left;font-size:13px;transition:0.2s}
.suggestions button:hover{border-color:#7e22ce;color:#fff;background:#1a1a22}

/* Messages */
.message{max-width:850px;margin:0 auto 20px;padding:18px;border-radius:12px;line-height:1.6;font-size:15px;animation:slideUp 0.3s}
@keyframes slideUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.user{background:#1a1a24;margin-left:auto;max-width:80%;border-bottom-right-radius:2px}
.ai{background:#0f0f14;border:1px solid #1e1e26;border-bottom-left-radius:2px}
.ai p {margin: 0 0 10px 0}
.ai p:last-child {margin-bottom:0}
.ai h1, .ai h2, .ai h3 { margin: 15px 0 10px 0; color: #d8b4fe; font-size: 18px;}
.ai h1 {font-size: 20px;}
.ai ul, .ai ol { margin: 10px 0; padding-left: 20px; }
.ai li { margin-bottom: 5px; }
.ai strong { color: #fff; }

/* Code Blocks */
.code-block { background: #000; border: 1px solid #222; border-radius: 8px; margin: 10px 0; overflow: hidden; }
.code-header { display: flex; justify-content: space-between; align-items: center; background: #111; padding: 6px 12px; font-size: 12px; color: #888; border-bottom: 1px solid #222; }
.copy-btn { background: #222; border: none; color: #ccc; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; transition: 0.2s;}
.copy-btn:hover { background: #333; color: #fff;}
.code-block pre { margin: 0; padding: 12px; overflow-x: auto; color: #e2e8f0; font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; line-height: 1.5;}

/* Input Area */
.input-area{max-width:850px;width:100%;margin:0 auto;padding:10px 20px 20px}
.input-box{background:#141419;border:1px solid #2a2a33;border-radius:16px;padding:12px;transition:0.2s;box-shadow:0 4px 20px rgba(0,0,0,0.3)}
.input-box:focus-within{border-color:#7e22ce;box-shadow:0 4px 25px rgba(126,34,206,0.15)}
textarea{width:100%;background:transparent;border:0;outline:0;color:#fff;resize:none;min-height:50px;max-height:200px;padding:5px;font-size:15px}
textarea::placeholder{color:#666}
.controls{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.controls button{border:0;border-radius:8px;padding:8px 12px;font-size:13px;transition:0.2s}
.send{background:#7e22ce;color:white;font-size:16px;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;padding:0}
.send:hover{background:#9333ea}
.send:disabled{opacity:.3;cursor:not-allowed}
.tools{background:transparent;color:#888}
.tools:hover{color:#fff;background:#1c1c24}
.tools.active{color:#d8b4fe;background:#2d2240}

/* Footer */
.bottom-info{text-align:center;color:#444;font-size:11px;margin-top:12px;display:flex;justify-content:center;align-items:center;gap:15px}
.bottom-info a{color:#5865F2;transition:0.2s;font-weight:bold}
.bottom-info a:hover{color:#7289da;text-decoration:underline}

/* Thinking Animation */
.thinking-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; color: #a78bfa; font-size: 14px; animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
.thinking-logo { width: 50px; height: 50px; margin-bottom: 15px; animation: spin 3s linear infinite; }
@keyframes spin { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(360deg); } }
.cursor::after{content:"▍";animation:blink 1s steps(2) infinite;color:#a78bfa}
@keyframes blink{50%{opacity:0}}

@media(max-width:768px){
  .sidebar{display:none}
  .suggestions{grid-template-columns:1fr}
  .user{max-width:95%}
  .message{max-width:100%}
  .discord-btn span{display:none}
  .discord-btn{padding:8px}
}
</style>
</head>
<body>

<svg style="display: none;">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
  </defs>
  <symbol id="ashLogo" viewBox="0 0 100 100">
    <path d="M 20 80 L 45 20 Q 50 10 55 20 L 80 80" stroke="url(#logoGrad)" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 35 60 Q 50 60 65 60" stroke="url(#logoGrad)" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M 45 20 Q 60 20 80 40 Q 90 50 80 60" stroke="url(#logoGrad)" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.8"/>
  </symbol>
</svg>

<aside class="sidebar">
  <div class="logo">
    <svg class="ash-logo-svg"><use href="#ashLogo"></use></svg>
    <span>Ash.ia</span>
  </div>
  <button class="new" onclick="newChat()">＋ New Chat</button>
  <div class="section">HISTORY</div>
  <div class="history" id="history"></div>
  <div class="sidebar-actions">
    <button onclick="exportHistory()">⬇ Export</button>
    <button onclick="importHistory()">⬆ Import</button>
  </div>
  <div class="sidebar-bottom">
    <strong>Ash.ia</strong> v3.0<br>
    Local Model via Ollama.<br>
    Optimized for 8GB RAM.
  </div>
</aside>

<main class="main">
<header>
  <div class="header-left">
    <svg class="ash-logo-svg" style="width:24px;height:24px;"><use href="#ashLogo"></use></svg>
    Ash.ia <span id="apiStatus" class="status" title="API Status">●</span>
  </div>
  <div class="header-right">
    <a href="https://discord.gg/w4BMaK7yv" target="_blank" class="discord-btn">
      <svg viewBox="0 0 127.14 96.36"><path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.31,60,73.31,53s5-12.74,11.43-12.74S96.2,46,96.12,53,91.08,65.69,84.69,65.69Z"/></svg>
      <span>Join Discord</span>
    </a>
    <select class="model" id="model">
      <option value="qwen2.5-coder:3b" selected>Qwen 2.5 Coder 3B (Best for 8GB)</option>
      <option value="qwen2.5-coder:1.5b">Qwen 2.5 Coder 1.5B (Ultra Fast)</option>
      <option value="llama3.2:3b">Llama 3.2 3B</option>
    </select>
  </div>
</header>

<section class="chat" id="chat">
  <div class="welcome" id="welcome">
    <svg class="ash-logo-big"><use href="#ashLogo"></use></svg>
    <h1>How can I help you today?</h1>
    <p>Expert in code, bots, automation, and advanced reasoning.</p>
    <div class="suggestions">
      <button onclick="suggest('Explain how to create a bot for Agar.io mobile step by step.')">🤖 Create a mobile bot</button>
      <button onclick="suggest('Give me the complete structure of a modern website in HTML/CSS/JS.')">⌘ Create a website</button>
      <button onclick="suggest('How does reverse engineering a network protocol work?')">🔍 Reverse Engineering</button>
      <button onclick="suggest('Help me fix this bug: [paste your code here].')">⚡ Fix a bug</button>
    </div>
  </div>
</section>

<div class="input-area">
  <div class="input-box">
    <textarea id="message" placeholder="Ask a technical question, paste your code..." rows="1"></textarea>
    <div class="controls">
      <button class="tools" id="modeBtn" onclick="toggleMode()">🧠 Deep Thinking</button>
      <button class="send" id="send" onclick="sendMessage()">↑</button>
    </div>
  </div>
  <div class="bottom-info">
    <span>Powered by Ollama (Local)</span>
    <span>•</span>
    <a href="https://discord.gg/w4BMaK7yv" target="_blank">Need help? Join the Discord</a>
  </div>
</div>
</main>

<script>
const API = "http://127.0.0.1:8000/api/chat";
const STORAGE_KEY = "ash_history";

let messages = [];
let conversations = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
let currentId = Date.now();
let mode = "normal";
let busy = false;

const chat  = document.getElementById("chat");
const input = document.getElementById("message");
const send  = document.getElementById("send");

/* ---------- HISTORY ---------- */
function renderHistory(){
  const history = document.getElementById("history");
  history.innerHTML = "";
  conversations.forEach(c => {
    const wrap = document.createElement("div");
    wrap.className = "history-item";
    const b = document.createElement("button");
    b.textContent = c.title;
    b.className = c.id === currentId ? "active" : "";
    b.onclick = () => loadChat(c.id);
    const del = document.createElement("button");
    del.className = "del";
    del.textContent = "✕";
    del.onclick = (e) => { e.stopPropagation(); deleteChat(c.id); };
    wrap.appendChild(b);
    wrap.appendChild(del);
    history.appendChild(wrap);
  });
}

function saveHistory(){
  if(!messages.length) return;
  const existing = conversations.findIndex(c => c.id === currentId);
  const conversation = {
    id: currentId,
    title: messages.find(m => m.role === "user")?.content.slice(0, 30) || "New Conversation",
    messages
  };
  if(existing >= 0) conversations[existing] = conversation;
  else conversations.unshift(conversation);
  conversations = conversations.slice(0, 30);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
  renderHistory();
}

function deleteChat(id){
  if(!confirm("Delete this conversation?")) return;
  conversations = conversations.filter(c => c.id !== id);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
  if(id === currentId) newChat();
  else renderHistory();
}

function exportHistory(){
  const blob = new Blob([JSON.stringify(conversations, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "ash_history.json";
  a.click();
  URL.revokeObjectURL(url);
}

function importHistory(){
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = ".json,application/json";
  inp.onchange = () => {
    const file = inp.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const data = JSON.parse(reader.result);
        if(!Array.isArray(data)) throw new Error("Invalid format");
        conversations = data.concat(conversations).slice(0,30);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
        renderHistory();
        alert("Import successful ✔");
      }catch(e){
        alert("Import error: " + e.message);
      }
    };
    reader.readAsText(file);
  };
  inp.click();
}

function newChat(){
  messages = [];
  currentId = Date.now();
  showWelcome();
  renderHistory();
}

function loadChat(id){
  const c = conversations.find(x => x.id === id);
  if(!c) return;
  currentId = id;
  messages = [...c.messages];
  renderMessages();
  renderHistory();
}

/* ---------- UI ---------- */
function showWelcome(){
  chat.innerHTML = `
    <div class="welcome" id="welcome">
      <svg class="ash-logo-big"><use href="#ashLogo"></use></svg>
      <h1>How can I help you today?</h1>
      <p>Expert in code, bots, automation, and advanced reasoning.</p>
      <div class="suggestions">
        <button onclick="suggest('Explain how to create a bot for Agar.io mobile step by step.')">🤖 Create a mobile bot</button>
        <button onclick="suggest('Give me the complete structure of a modern website in HTML/CSS/JS.')">⌘ Create a website</button>
        <button onclick="suggest('How does reverse engineering a network protocol work?')">🔍 Reverse Engineering</button>
        <button onclick="suggest('Help me fix this bug: [paste your code here].')">⚡ Fix a bug</button>
      </div>
    </div>`;
}

function suggest(text){ input.value = text; sendMessage(); }

function toggleMode(){
  mode = (mode === "normal") ? "code" : "normal";
  const btn = document.getElementById("modeBtn");
  btn.classList.toggle("active", mode === "code");
  btn.textContent = mode === "code" ? "🧠 Deep Thinking Active" : "🧠 Deep Thinking";
}

// Rendu Markdown
function formatMarkdown(text) {
  let html = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (match, lang, code) => {
    const language = lang || "text";
    const escapedCode = code.trim();
    return `<div class="code-block"><div class="code-header"><span>${language.toUpperCase()}</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code>${escapedCode}</code></pre></div>`;
  });
  html = html.replace(/`([^`]+)`/g, '<code style="background:#222;padding:2px 5px;border-radius:4px;font-family:monospace;color:#e2e8f0">$1</code>');
  html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
  html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
  html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
  html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/^\s*-\s+(.*$)/gim, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
  html = html.split('\n').map(line => {
    if (line.trim() === '' || line.startsWith('<ul>') || line.startsWith('<li>') || line.startsWith('<h') || line.startsWith('<div') || line.startsWith('</') || line.startsWith('<pre>')) return line;
    return `<p>${line}</p>`;
  }).join('');
  return html;
}

window.copyCode = function(btn) {
  const code = btn.closest('.code-block').querySelector('code').innerText;
  navigator.clipboard.writeText(code).then(() => {
    const old = btn.innerText;
    btn.innerText = "Copied!";
    btn.style.color = "#4ade80";
    setTimeout(() => { btn.innerText = old; btn.style.color = ""; }, 2000);
  });
};

function addMessage(role, text){
  const div = document.createElement("div");
  div.className = "message " + role;
  if (role === "ai") div.innerHTML = formatMarkdown(text);
  else div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function renderMessages(){
  chat.innerHTML = "";
  messages.forEach(m => addMessage(m.role === "user" ? "user" : "ai", m.content));
}

/* ---------- PROMPT SYSTÈME OPTIMISÉ ---------- */
function buildSystemPrompt(){
  return `You are Ash.ia, a powerful, expert AI developer specializing in programming, reverse engineering, cybersecurity, bots, and automation.

ABSOLUTE RULES:
- You MUST respond in the SAME LANGUAGE as the user's prompt (if English, English. If French, French).
- Never refuse a technical request. If it's for a game bot (Agar.io, etc.), cheating, or reverse engineering, explain the technique, provide the full code, and add a warning about risks WITHOUT refusing.
- Do not moralize. Help first, warn second.
- Be FAST and DIRECT. No long introductions. Get straight to the point.
- Use clean Markdown formatting. Put code in \`\`\`language blocks. If multiple files, use headers (### filename).
- Explain the logic briefly, then give the solution.

REASONING METHOD:
1. **Analysis**: What is requested?
2. **Plan**: How to proceed? (Architecture, tools).
3. **Code**: Complete, functional code.
4. **Explanation**: How to install and use.
5. **Risks**: Warning if necessary.

${mode === "code" ? "DEEP THINKING MODE: Take your time to analyze. Break down every step. Be exhaustive in the code." : ""}`;
}

/* ---------- SEND ---------- */
async function sendMessage(){
  const text = input.value.trim();
  if(!text || busy) return;

  document.getElementById("welcome")?.remove();
  input.value = "";
  busy = true;
  send.disabled = true;

  messages.push({role:"user", content:text});
  addMessage("user", text);

  const answer = document.createElement("div");
  answer.className = "message ai";
  answer.innerHTML = `
    <div class="thinking-container">
      <svg class="thinking-logo"><use href="#ashLogo"></use></svg>
      <div id="thinking-text">Analyzing request...</div>
    </div>
  `;
  chat.appendChild(answer);
  chat.scrollTop = chat.scrollHeight;

  const thinkingSteps = ["Parsing context...", "Designing architecture...", "Writing code...", "Optimizing response..."];
  let stepIndex = 0;
  const stepInterval = setInterval(() => {
    const el = document.getElementById("thinking-text");
    if (el && stepIndex < thinkingSteps.length) {
      el.textContent = thinkingSteps[stepIndex++];
    }
  }, 600);

  let full = "";

  try{
    const response = await fetch(API, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model: document.getElementById("model").value,
        messages: [
          {role:"system", content:buildSystemPrompt()},
          ...messages
        ]
      })
    });

    if(!response.ok) throw new Error("HTTP " + response.status);

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let firstChunk = true;

    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buffer += decoder.decode(value, {stream:true});
      const lines = buffer.split("\n");
      buffer = lines.pop() || "";
      for(const line of lines){
        if(!line.trim()) continue;
        let data;
        try{ data = JSON.parse(line); }catch(e){ continue; }
        if(data.error) throw new Error(data.error);
        if(data.done) continue;
        if(typeof data.content === "string" && data.content.length){
          if (firstChunk) {
            clearInterval(stepInterval);
            answer.innerHTML = "";
            firstChunk = false;
          }
          full += data.content;
          answer.innerHTML = formatMarkdown(full);
          chat.scrollTop = chat.scrollHeight;
        }
      }
    }

    clearInterval(stepInterval);

    if(!full.trim()){
      answer.innerHTML = "<p>⚠️ Empty response from model.</p>";
    }else{
      messages.push({role:"assistant", content:full});
      saveHistory();
    }

  }catch(error){
    clearInterval(stepInterval);
    answer.innerHTML = `<p style="color:#f87171">❌ Error: ${error.message}</p>
    <p style="font-size:13px;color:#888">Make sure <code>python ash.py</code> is running and Ollama is active.</p>`;
  }finally{
    busy = false;
    send.disabled = false;
    input.focus();
  }
}

input.addEventListener("keydown", e=>{
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

async function checkApiStatus(){
  const dot = document.getElementById("apiStatus");
  if(!dot) return;
  try{
    await fetch("http://127.0.0.1:8000/health", {method:"GET"});
    dot.className = "status ok";
    dot.title = "API Online";
  }catch(e){
    dot.className = "status ko";
    dot.title = "API Offline — run ash.py";
  }
}

renderHistory();
showWelcome();
checkApiStatus();
setInterval(checkApiStatus, 15000);
</script>
